name: Accounting API CI

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-password
          POSTGRES_DB: AccountingDb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__AccountingDatabase: Host=localhost;Port=5432;Database=AccountingDb;Username=postgres;Password=postgres-ci-password

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.10

      - name: Apply database migrations
        run: dotnet ef database update --project Accounting.Api/Accounting.Api.csproj

      - name: Start API
        run: dotnet run --project Accounting.Api/Accounting.Api.csproj --no-build --urls http://localhost:5072 &

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://localhost:5072/api/company > /dev/null; then
              echo "API is ready"
              exit 0
            fi

            echo "Waiting for API..."
            sleep 2
          done

          echo "API did not start"
          exit 1

      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Run Postman tests
        run: |
          postman collection run "postman/AccountingAPI.postman_collection.json" \
            --env-var "baseUrl=http://localhost:5072"